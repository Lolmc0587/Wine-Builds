name: Bootstraps CI Arm64 host

on:
  schedule:
    - cron:  0 0 1 */2 *
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Create bootstraps
        run: |
          sudo apt update
          sudo apt install debootstrap perl
          chmod +x create_ubuntu_bootstraps.sh
          sudo ./create_ubuntu_bootstraps.sh
          cd /opt
          sudo tar -I "xz -T0 -9" -cpf bootstraps.tar.xz chroots
          sha256sum *.tar.xz
      - name: Upload all build logs and artifacts on failure
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-failure-logs
          path: |
            /opt/mingw/*.log
            /opt/mingw/bld/**/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Bootstraps
          path: /opt/bootstraps.tar.xz
