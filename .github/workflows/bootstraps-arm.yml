name: Bootstraps CI Arm64

on:
  schedule:
    - cron: '0 0 1 */2 *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Build Native Dependencies
        run: |
          sudo apt update
          sudo apt install debootstrap perl
          chmod +x create_ubuntu_bootstraps_arm64.sh
          sudo ./create_ubuntu_bootstraps_arm64.sh

          # Compress the installed prefix
          cd /opt
          sudo tar -I "xz -T0 -9" -cpf bootstraps.tar.xz chroots
          sha256sum bootstraps.tar.xz

      - name: Upload Bootstraps artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bootstraps
          path: /opt/bootstraps.tar.xz
