name: Wine Git CI Arm64

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Download bootstraps artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: bootstraps.yml
          workflow_conclusion: success
          path: /opt

      - name: Prepare Environment and Build Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y perl git wget xz-utils autoconf flex bison pkg-config ninja-build

          # Extract custom dependencies to /opt/wine-deps
          sudo tar -C /opt -xpf /opt/Bootstraps/bootstraps.tar.xz

          chmod +x build_wine.sh
          export WINE_VERSION="git"

          WINE_BRANCH=vanilla ./build_wine.sh
          WINE_BRANCH=staging ./build_wine.sh
          sha256sum *.tar.xz

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wine-Git
          path: ./*.tar.xz
